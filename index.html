<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ueno 3D - Catálogo de Impressões</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="container header-container">
            <div class="logo-wrapper">
                <img src="logo.png" alt="Ueno 3D Logo" class="logo-img">
                <span class="logo-text">UENO 3D</span>
            </div>
            <a href="admin.html" class="login-btn">Admin Login</a>
        </div>
    </header>

    <main class="container">
        <section class="intro">
            <h2>Catálogo de Peças 3D</h2>
            <p>Itens exclusivos e personalizados, impressos com alta precisão e qualidade.</p>
        </section>

        <div class="catalog-grid" id="catalogGrid">
            <p style="text-align: center; width: 100%; padding: 40px; color: #888;">Carregando produtos...</p>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 Ueno 3D. Todos os direitos reservados.</p>
        </div>
    </footer>

    <!-- Botão WhatsApp Flutuante Geral (Canto da tela) -->
    <a href="#" id="link-wa-flutuante" target="_blank" class="float-wa">
        <!-- Ícone do WhatsApp em formato SVG para carregar rápido -->
        <svg viewBox="0 0 32 32" width="35" height="35" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><path d="M16 2a13 13 0 0 0-10.9 20.1L3 29l7.1-2.1A13 13 0 1 0 16 2zm0 24.2a11 11 0 0 1-5.6-1.5l-.4-.2-4.2 1.2 1.3-4.1-.3-.4A11 11 0 1 1 16 26.2zm6-8.2c-.3-.2-2-.9-2.3-1-.3-.1-.5-.2-.7.1-.2.3-.9 1.1-1 1.3-.2.2-.4.2-.7.1-.3-.1-1.4-.5-2.6-1.6-1-1-1.2-1.2-1.4-1.5-.2-.3 0-.4.1-.6l.5-.6c.2-.2.2-.4.3-.6.1-.2 0-.4-.1-.6-.1-.2-.8-1.9-1-2.6-.2-.7-.5-.6-.7-.6h-.6c-.2 0-.6.1-.9.4-.3.3-1.2 1.2-1.2 2.8 0 1.6 1.2 3.1 1.4 3.4.2.3 2.3 3.6 5.6 5 2.2.9 3 1 3.9.9.9-.1 2-.8 2.3-1.6.3-.8.3-1.5.2-1.6-.1-.2-.4-.3-.7-.4z"/></svg>
    </a>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
        import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore.js";

        // =========================================================
        // 1. CONFIGURE SEU WHATSAPP AQUI (Ex: 55 + DDD + Número)
        // =========================================================
        const meuWhatsApp = "5519991228391"; 
        
        // Link para o botão flutuante
        document.getElementById('link-wa-flutuante').href = `https://wa.me/${meuWhatsApp}?text=Olá! Gostaria de saber mais sobre as impressões 3D.`;

        // =========================================================
        // 2. COLE AQUI AS SUAS CHAVES DO FIREBASE
        // =========================================================
        const firebaseConfig = {
			apiKey: "AIzaSyDog1tIqTJ8roZ-535Oi4Vlmz6LpZKDjt8",
			authDomain: "ueno-3d.firebaseapp.com",
			projectId: "ueno-3d",
			storageBucket: "ueno-3d.firebasestorage.app",
			messagingSenderId: "1052191833120",
			appId: "1:1052191833120:web:13398e34919e64b1e99045"
		};
        // =========================================================

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        async function carregarProdutos() {
            const catalogGrid = document.getElementById('catalogGrid');
            try {
                const q = query(collection(db, "produtos"), orderBy("dataCriacao", "desc"));
                const querySnapshot = await getDocs(q);
                
                catalogGrid.innerHTML = ''; 

                if (querySnapshot.empty) {
                    catalogGrid.innerHTML = '<p style="text-align: center; width: 100%;">Nenhum produto cadastrado ainda.</p>';
                    return;
                }

                querySnapshot.forEach((doc) => {
                    const produto = doc.data();
                    
                    // Cria a mensagem automática para aquele produto
                    const mensagem = encodeURIComponent(`Olá! Tenho interesse na peça 3D: ${produto.nome} (R$ ${produto.preco})`);
                    const linkZap = `https://wa.me/${meuWhatsApp}?text=${mensagem}`;
                    
                    const cardHTML = `
                        <div class="product-card">
                            <div class="product-image">
                                <img src="${produto.imagemUrl}" alt="${produto.nome}">
                            </div>
                            <div class="product-info">
                                <h3>${produto.nome}</h3>
                                <p>${produto.descricao}</p>
                                <div class="price-action">
                                    <span class="price">R$ ${produto.preco}</span>
                                    <a href="${linkZap}" target="_blank" class="btn-wa-card">
                                        WhatsApp
                                    </a>
                                </div>
                            </div>
                        </div>
                    `;
                    catalogGrid.innerHTML += cardHTML;
                });

            } catch (error) {
                catalogGrid.innerHTML = '<p style="text-align: center; color: red;">Erro ao carregar o catálogo. Tente atualizar a página.</p>';
            }
        }

        carregarProdutos();
    </script>
</body>
</html>
